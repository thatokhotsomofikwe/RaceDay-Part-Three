services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - raceday-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  raceday-api:
    build:
      context: ./RaceDay.API
      dockerfile: Dockerfile
    ports:
      - "5030:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db;Database=RaceDayDB;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      AzureBlobStorage__ConnectionString: "${AZURE_BLOB_CONNECTION_STRING}"
      AzureBlobStorage__ContainerName: "raceday-event-images"
    depends_on:
      db:
        condition: service_healthy

  raceday-mvc:
    build:
      context: ./RaceDay.MVC
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ApiBaseUrl: "http://raceday-api:8080/"
    depends_on:
      - raceday-api

volumes:
  raceday-sql-data: